<!DOCTYPE html>
<html lang="{{ lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://rsms.me/">
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" href="resources/favicon.svg" type="image/svg+xml">
    </head>
    <body data-theme="{{ theme }}" class="grid-bg">

        <!-- Navigation Header -->
        {{ header }}

        <!-- Restored Original Container Width -->
        <main class="container prose">
            <header class="article-header">
                <h1>{{ title }}</h1>
                <div class="article-meta">
                    <span class="category">{{ category }}</span>
                    <span class="date">{{ date }}</span>
                    <div class="tags">
                        {{ tags_html }}
                    </div>
                </div>
            </header>
            {{ content }}
        </main>

        <!-- Footer -->
        {{ footer }}
    </body>
</html>
