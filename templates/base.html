<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Atharva's Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
      :root {
        --bg: #F5F0E8;
        --surface: #FFFFFF;
        --surface-alt: #FFF3C4;
        --text: #111111;
        --muted: #4B4B4B;
        --accent: #FFD400;
        --accent-2: #00A878;
        --accent-3: #FF4433;
        --border: #111111;
        --shadow: 6px 6px 0 #111111;
        --shadow-sm: 4px 4px 0 #111111;
        --shadow-lg: 10px 10px 0 #111111;
        --grid-line: rgba(17, 17, 17, 0.06);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        line-height: 1.6;
      }

      h1, h2, h3, h4 { font-weight: 700; line-height: 1.2; }
      code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
      a { color: inherit; text-decoration: none; }

      ::selection { background: var(--accent); color: #111; }

      /* ---------- Top Navigation ---------- */
      .navbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 4vw; border-bottom: 3px solid var(--border);
        background: var(--surface);
        position: sticky; top: 0; z-index: 50;
      }

      .brand {
        display: flex; align-items: center; gap: 12px;
        font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em;
      }
      .brand .glyph {
        width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
        background: var(--accent); border: 2px solid var(--border); font-size: 16px;
      }

      .nav-links { display: flex; gap: 24px; font-weight: 600; font-size: 14px; }
      .nav-links a:hover { color: var(--accent-2); }

      .search-box {
        display: flex; align-items: center; gap: 8px; border: 2px solid var(--border);
        background: var(--bg); padding: 8px 16px; font-size: 13px; color: var(--muted);
        box-shadow: inset 2px 2px 0 rgba(0,0,0,0.05);
        width: 320px;
        cursor: text;
      }

      /* ---------- Article Metadata Header ---------- */
      .article-header {
        border-bottom: 3px solid var(--border);
        padding-bottom: 24px;
        margin-bottom: 40px;
      }

      .article-header h1 {
        font-size: clamp(32px, 5vw, 54px);
        letter-spacing: -0.02em;
        margin-bottom: 20px;
      }

      .article-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
      }

      .article-meta .category {
        background: var(--text);
        color: var(--surface);
        padding: 4px 10px;
        text-transform: uppercase;
      }

      .article-meta .date {
        color: var(--muted);
      }

      .article-meta .tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .article-meta .tag-pill {
        border: 1px solid var(--border);
        padding: 2px 8px;
        background: var(--surface);
        border-radius: 4px;
      }

      /* ---------- Prose Overrides for Spacing ---------- */
      .prose h2 { font-size: 28px; margin: 40px 0 16px 0; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
      .prose h3 { font-size: 22px; margin: 32px 0 12px 0; }
      .prose h4 { font-size: 18px; margin: 24px 0 8px 0; }
      .prose p { margin-bottom: 20px; color: #222; }
      .prose ul, .prose ol { margin: 0 0 20px 24px; }
      .prose li { margin-bottom: 6px; }
      .prose blockquote {
        border-left: 4px solid var(--accent);
        background: var(--surface-alt);
        padding: 16px 20px;
        margin: 24px 0;
        font-style: italic;
      }
      .prose pre {
        background: var(--text);
        color: #fff;
        padding: 20px;
        border: 2px solid var(--border);
        box-shadow: var(--shadow-sm);
        overflow-x: auto;
        margin: 24px 0;
      }
      .prose code {
        background: rgba(0,0,0,0.06);
        padding: 2px 6px;
        font-size: 0.9em;
      }
      .prose pre code {
        background: transparent;
        padding: 0;
      }

      /* Added Image Styling for Brutalist Borders & Mobile Responsiveness */
      .prose img {
       max-width: 100%;
       height: auto;
       display: block;
       margin: 24px 0;
       border: 2px solid var(--border);
       box-shadow: var(--shadow-sm);
     }

      /* ---------- Footer ---------- */
      .site-footer {
        border-top: 3px solid var(--border); background: var(--surface); padding: 32px 4vw;
        display: flex; align-items: center; justify-content: space-between;
        font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
        gap: 24px;
      }
      .site-footer .footer-note { max-width: 600px; line-height: 1.5; }
      .socials { display: flex; gap: 12px; shrink: 0; }
      .socials a { font-weight: 700; text-decoration: underline; }

      @media (max-width: 900px) {
        .nav-links, .search-box { display: none; }
        .site-footer { flex-direction: column; align-items: flex-start; }
      }
    </style>
</head>
<body data-theme="{{ theme }}">

  <!-- Navigation Header -->
  <header class="navbar">
    <a href="/" class="brand">
      <span class="glyph">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/>
        </svg>
      </span>
      Atharva's Website
    </a>
    <nav class="nav-links">
      <a href="/">Articles</a>
      <a href="#">Knowledge Base</a>
      <a href="#">About</a>
    </nav>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Search logs...
    </div>
  </header>

  <!-- Restored Original Container Width -->
  <main class="container prose">
    <header class="article-header">
      <h1>{{ title }}</h1>
      <div class="article-meta">
        <span class="category">{{ category }}</span>
        <span class="date">{{ date }}</span>
        <div class="tags">
          {{ tags_html }}
        </div>
      </div>
    </header>

    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-note">
      Written by Atharva Vaidya. No fixed schedule — new dispatches appear whenever something's worth writing down.
    </div>
    <div class="socials">
      <a href="https://github.com/athu16">GitHub</a> / <a href="https://www.youtube.com/@atharvavaidya9245">YouTube</a> / <a href="feed.xml">RSS</a>
    </div>
  </footer>

</body>
</html>
