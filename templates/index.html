<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atharva's Website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="resources/favicon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Navigation -->
  {{ header }}

  <!-- Hero / Introduction -->
  <section class="hero grid-bg">
    <div class="hero-eyebrow">A PERSONAL SITE, UPDATED IRREGULARLY</div>
    <h1 id="hero-headline">&nbsp;</h1>
    <p class="lead">I write about things I find interesting or stuff I want to remember.</p>

  </section>

  <!-- Divider -->
  <div class="hexrule" id="hexrule"></div>

  <!-- Workspace -->
  <section class="homepage-workspace">

    <!-- Left Sidebar: Topic Filters -->
    <aside class="sidebar">
      <div class="sidebar-block">
        <div class="sidebar-title">Topics</div>
        <div class="directory-list">
          <!-- Dynamically populated by build.py -->
        </div>
      </div>
    </aside>

    <!-- Right Feed: Recent Articles -->
    <div class="feed">
      <div class="feed-header">
        <h2 id="feed-title">Recent Articles</h2>
      </div>

      <div class="articles-grid">
        <!-- Dynamically populated by build.py -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  {{ footer }}

<script>
  // Hex rule divider: continuous data stream aesthetic
  function fillHexRule(el) {
    let str = '';
    const chars = '0123456789ABCDEF ';
    for (let i = 0; i < 300; i++) {
      str += chars[Math.floor(Math.random() * chars.length)];
    }
    el.textContent = str;
  }
  const hexEl = document.getElementById('hexrule');
  if (hexEl) fillHexRule(hexEl);

  // Decoding hero headline
  const headlineEl = document.getElementById('hero-headline');
  const finalText = "Hi, I'm Atharva.";
  const glitchChars = '01XYZ&#*@%';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function decodeText(el, text, duration) {
    if (!el) return;
    if (reduceMotion) { el.textContent = text; return; }
    const steps = 15;
    let frame = 0;
    const interval = setInterval(() => {
      frame++;
      const revealCount = Math.floor((frame / steps) * text.length);
      let out = '';
      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ') { out += ' '; continue; }
        if (i < revealCount) {
          out += text[i];
        } else {
          out += `<span class="decoding">${glitchChars[Math.floor(Math.random() * glitchChars.length)]}</span>`;
        }
      }
      el.innerHTML = out;
      if (frame >= steps) {
        clearInterval(interval);
        el.innerHTML = text;
      }
    }, duration / steps);
  }

  decodeText(headlineEl, finalText, 700);

  // Interactive Category Filter Logic
  document.addEventListener('DOMContentLoaded', () => {
    const dirLinks = document.querySelectorAll('.directory-list a');
    const cards = document.querySelectorAll('.articles-grid .article-card');
    const feedTitle = document.getElementById('feed-title');

    dirLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();

        // Update active class state on sidebar
        dirLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        // Extract selected category text (stripping the count tag)
        const selectedCategory = link.childNodes[0].textContent.trim();

        if (feedTitle) {
          feedTitle.textContent = selectedCategory === "All Articles" ? "Recent Articles" : selectedCategory;
        }

        // Show/hide article cards
        cards.forEach(card => {
          const cardCategoryEl = card.querySelector('.category');
          const cardCategory = cardCategoryEl ? cardCategoryEl.textContent.trim() : '';

          if (selectedCategory === "All Articles" || cardCategory.toLowerCase() === selectedCategory.toLowerCase()) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  });
</script>

</body>
</html>
